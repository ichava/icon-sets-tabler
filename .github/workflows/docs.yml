name: Docs

# `tests.yml` and `code-quality.yml` both carry `paths-ignore: ['**.md']`, so a
# markdown-only pull request runs neither -- and a markdown-only pull request is
# exactly what deletes a docs page. This workflow is the other half of that
# filter: it runs on the changes they skip, and nothing else.
on:
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - 'tests/Unit/DocsShapeTest.php'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Docs shape

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Assert the docs shape
        run: vendor/bin/pest --filter=DocsShapeTest
